# Publica la app en GitHub Pages: https://elvicticor.github.io/Pokeverse/
# Requiere una vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Los commits del workflow de precios (hechos con GITHUB_TOKEN) no disparan "push",
  # así que se vuelve a publicar cuando ese workflow termina bien.
  workflow_run:
    workflows: ['Actualizar precios de cartas']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # en workflow_run, toma el main con el cards.json recién actualizado
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # SPA: GitHub Pages sirve 404.html en rutas desconocidas (/Pokeverse/mercado al recargar)
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
